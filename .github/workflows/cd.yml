name: Deploy
on:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Ignore superseded releases
        id: current
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" == "$RELEASE_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build production image
        if: steps.current.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: docker build --build-arg "RELEASE_SHA=$RELEASE_SHA" -t "impossible-penalty:$RELEASE_SHA" .
      - name: Transfer and activate
        if: steps.current.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$latest" == "$RELEASE_SHA" ]] || { echo "A newer main exists; skipping release"; exit 0; }
          umask 077
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/deploy_known_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          docker image save "impossible-penalty:$RELEASE_SHA" | gzip | \
            ssh -i "$key" -p "${DEPLOY_PORT:-22}" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" "$RELEASE_SHA"
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "${DEPLOY_URL%/}/healthz"
          actual=$(curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "${DEPLOY_URL%/}/version.txt")
          [[ "$actual" == "$RELEASE_SHA" ]]
